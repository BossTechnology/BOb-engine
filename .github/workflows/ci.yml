name: CI

on:
  push:
    branches: [main]
  pull_request:

# ID-12 — a tenancy failure is a build-blocking defect, not a bug.
#
# ALL FIVE JOBS BELOW MUST BE REQUIRED STATUS CHECKS on the protected branch:
#
#   Migrations apply from an empty database
#   Tenancy (build-blocking · ID-10 to ID-12)
#   Contracts, schema and naming
#   Availability (FR-20 to FR-23)
#   Chain applies as bob_migrador (O-3)
#
# Today main requires the first four. "Chain applies as bob_migrador (O-3)" is
# still to be made required by Henry, in branch protection.
#
# Lint and build joins this list when an application layer exists. The setting
# lives in branch protection, not here, and is the one part of ID-12 a workflow
# file cannot assert about itself.

# Read-only token: the jobs read the code and the PR's comments and labels, and
# write nothing to the repository (O-3 third review).
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The one place the Supabase CLI version is set. Every setup-cli step reads it,
# and ci-coverage fails if one does not. A concrete version means setup-cli makes
# no release lookup: with `latest` it called the GitHub API unauthenticated, on
# the runner's shared per-IP limit, and a check went red on that (F-16). Bump it
# by hand, in a pull request that changes nothing else; the four checks are the
# test of the bump.
env:
  SUPABASE_CLI_VERSION: 2.120.0

jobs:
  # Runs on every change, first, and independently of anything else. If the
  # migration chain does not apply from nothing, no other result means anything.
  migrations:
    name: Migrations apply from an empty database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Start the local stack
        run: supabase start
      - name: Apply the full chain from scratch
        run: supabase db reset --no-seed
      # A reset that skips a misnamed migration still exits 0, so the step
      # above passing does not mean the chain applied. F-15.
      - name: Every migration file has a name the CLI applies, and schema_migrations holds exactly their versions
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node --test --test-concurrency=1 tests/migrations-applied.test.mjs

  tenancy:
    name: Tenancy (build-blocking · ID-10 to ID-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase db reset --no-seed
      - name: ID-10, ID-11, ID-12
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm run test:tenancy

  schema:
    name: Contracts, schema and naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase db reset --no-seed
      - name: SR-1, SR-2, PR-9, R-01 to R-03, BR-3, D-16
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node --test --test-concurrency=1 tests/slice0-schema.test.mjs
      - name: D-11, D-27, C-07, IR-1 — Slice 1 schema
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node --test --test-concurrency=1 tests/slice1-schema.test.mjs
      - name: Slice 2 · projection schema, partition function (H1), F-21, F-22 — contract §10
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node --test --test-concurrency=1 tests/slice2-schema.test.mjs
      - name: Slice 2 · reference feeder, two counts, ghost reconciliation, rebuild — contract §8, §10
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node --test --test-concurrency=1 tests/slice2-feeder.test.mjs
      - name: P5 §6.3 · three roles, bob_ai_ro reads views only, no egress; the box check of objection 3
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node --test --test-concurrency=1 tests/p5-roles.test.mjs
      - name: P5 Q6 (a) · the staged member refs, INSERT only for the feeder, under the tenant's claim
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node --test --test-concurrency=1 tests/p5-q6-member-refs.test.mjs
      - name: BR-3 · the mutative exemption is closed, and the F-07 rulings are a fixture
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node --test --test-concurrency=1 tests/autobotz-br3.test.mjs
      - name: Slice 6 · RS-30 to RS-35, the webhook move, the outbox and its limits, read back as a projection
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node --test --test-concurrency=1 tests/slice6-registries-outbox.test.mjs
      - name: Who may sign in · bob_app reads its organization's users, signing up makes no row, provisioning, the box warning
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node --test --test-concurrency=1 tests/users-access.test.mjs
      # The path is named: the bare command also runs supabase/tests/fixtures/*.sql,
      # which are fixtures, not pgTAP, and fails on them.
      - name: pgTAP · supabase test db over supabase/tests/database
        run: supabase test db supabase/tests/database
      - name: Product naming is case-sensitive
        run: node --test --test-concurrency=1 tests/naming.test.mjs
      # Asserts every test file is invoked by some job here, so the next guard
      # added cannot be orphaned from CI.
      - name: Every guard runs in CI
        run: node --test --test-concurrency=1 tests/ci-coverage.test.mjs

  availability:
    name: Availability (FR-20 to FR-23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase db reset --no-seed
      - name: FR-20 is the single most important rule in the acceptance suite
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm run test:availability

  # O-3 (D77 §2.8): BOb installed as a box gets it (scripts/instalar-bob.sh):
  # postgres pushes the install chain once, supabase_admin hands bob to
  # bob_migrador, and every other migration is pushed by bob_migrador. Then
  # scripts/owner-chain-check.mjs checks what that left. See P5 §6.2.
  owner-chain-probe:
    name: Chain applies as bob_migrador (O-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: pnpm install --frozen-lockfile
      # The approval names the list it approves: Henry's comment carries the
      # sha256 of the exact install-chain.sha256 under test, and the PR carries
      # the label now. Any later push that touches the list changes that hash,
      # so an approval never outlives the list it saw. A comment, not a review:
      # GitHub does not let an author approve their own PR. The guard lives in
      # this workflow, so a PR could edit it away: .github/CODEOWNERS puts the
      # workflow under Henry, and requiring code-owner review is his setting.
      - name: The install chain list changes only with Henry's approval (O-3)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVER: ${{ vars.INSTALL_CHAIN_APPROVER }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        run: |
          list=supabase/provision/install-chain.sha256
          git fetch --no-tags --depth=1 origin "$BASE"
          if ! git cat-file -e "FETCH_HEAD:$list" 2>/dev/null; then echo "$list is not on $BASE yet"; exit 0; fi
          if git diff --quiet FETCH_HEAD -- "$list"; then echo "$list unchanged"; exit 0; fi
          git diff FETCH_HEAD -- "$list"
          want="install-chain-change $(sha256sum "$list" | cut -d' ' -f1)"
          fail() { echo "::error::$list changed. The install chain is frozen (O-3, P5 §6.2). It passes only with the label install-chain-change on the PR and a comment by the repository variable INSTALL_CHAIN_APPROVER reading: $want. $1 Re-run the job after approving."; exit 1; }
          [ -n "$APPROVER" ] || fail "INSTALL_CHAIN_APPROVER is not set."
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -q '.[].name' | grep -qx install-chain-change || fail "The label is not on the PR now."
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q ".[] | select(.user.login == \"$APPROVER\") | .body" | grep -qxF "$want" || fail "No comment by $APPROVER names this list."
          echo "changed, approved by $APPROVER for this exact list"
      # The box's image, supabase/postgres:17.6.1.136 (F-37), not CI's 15: the
      # alta of bzzz#450 relies on Postgres 16+.
      - name: Start Supabase on the box's Postgres image, with no migration
        run: |
          mv supabase/migrations "$RUNNER_TEMP/chain" && mkdir supabase/migrations
          sed -i 's/^major_version = 15$/major_version = 17/' supabase/config.toml
          mkdir -p supabase/.temp && echo 17.6.1.136 > supabase/.temp/postgres-version
          sed -i '/\[auth.hook.custom_access_token\]/,/^enabled/ s/^enabled = true/enabled = false/' supabase/config.toml
          supabase start
          rmdir supabase/migrations && mv "$RUNNER_TEMP/chain" supabase/migrations
          docker ps --format '{{.Image}}' | grep -E 'supabase/postgres:' | tee /dev/stderr | grep -q ':17.6.1.136$'
      # No password on a command line: instalar-bob.sh reads it from a file, as
      # on a box (CI's local stack has the default one).
      - name: 1 · the install chain (scripts/instalar-bob.sh cadena)
        env:
          POSTGRES_ENV: ${{ runner.temp }}/postgres.env
          POSTGRES_PORT: '54322'
          SUDO: ''
        run: |
          (umask 077; echo POSTGRES_PASSWORD=postgres > "$POSTGRES_ENV")
          scripts/instalar-bob.sh cadena
      # Step 2 on a box is Bzzz's alta (bzzz#450). Here, its stand-in, writing
      # the same migrador.env the alta writes.
      - name: 2 · the alta, CI stand-in for bzzz#450
        env:
          POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_ADMIN_URL: postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres
        run: |
          (cd supabase/provision && psql "$POSTGRES_URL" -X -q -v ON_ERROR_STOP=1 -f alta-ci.sql)
          psql "$SUPABASE_ADMIN_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/provision/alta-ci-supabase-admin.sql
          psql "$SUPABASE_ADMIN_URL" -X -q -v ON_ERROR_STOP=1 -v pw=bob_migrador-local-test \
            <<< "ALTER ROLE bob_migrador LOGIN PASSWORD :'pw';"
          printf 'MIGRADOR_USUARIO=bob_migrador\nMIGRADOR_CLAVE=bob_migrador-local-test\nMIGRADOR_HOST=127.0.0.1\nMIGRADOR_RED=\n' > "$RUNNER_TEMP/migrador.env"
      - name: 3 · every other migration (scripts/instalar-bob.sh resto)
        env:
          POSTGRES_ENV: ${{ runner.temp }}/postgres.env
          POSTGRES_PORT: '54322'
          MIGRADOR_ENV: ${{ runner.temp }}/migrador.env
          MIGRADOR_PUERTO: '54322'
          SUDO: ''
        run: |
          scripts/instalar-bob.sh revisar supabase/migrations/*.sql
          scripts/instalar-bob.sh resto
      - name: Check what it left
        env:
          ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          MIGRADOR_PASSWORD: bob_migrador-local-test
        run: CHAIN_DIR=supabase/migrations node scripts/owner-chain-check.mjs
      # Today every migration is in the install chain, so step 3 applies nothing.
      # Sample migrations show what it does with one: a good file applies and is
      # recorded in one transaction, a failing one leaves neither, and a file
      # with a psql metacommand is refused before anything runs. After the
      # check, so the samples never reach it.
      - name: resto applies a file whole or not at all
        env:
          POSTGRES_ENV: ${{ runner.temp }}/postgres.env
          POSTGRES_PORT: '54322'
          MIGRADOR_ENV: ${{ runner.temp }}/migrador.env
          MIGRADOR_PUERTO: '54322'
          SUDO: ''
          ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          m=supabase/migrations
          q() { psql "$ADMIN_URL" -X -A -t -q -v ON_ERROR_STOP=1 "$@"; }
          recorded() { q -c "SELECT count(*) FROM supabase_migrations.schema_migrations WHERE version = '$1'"; }
          ok() { local sql=$1 msg=$2; shift 2; [ "$(q "$@" <<< "$sql")" = t ] || { echo "::error::$msg"; exit 1; }; }
          cat > $m/99990101000001_ci_resto_bare.sql <<'SQL'
          CREATE TABLE bob.ci_resto_bare (id int);
          SQL
          cat > $m/99990101000002_ci_resto_wrapped.sql <<'SQL'
          BEGIN;
          CREATE TABLE bob.ci_resto_wrapped (id int);
          CREATE FUNCTION bob.ci_resto_f() RETURNS text LANGUAGE sql AS $$ SELECT E'a\\b' $$;
          COMMIT;
          SQL
          cat > $m/99990101000003_ci_resto_fails.sql <<'SQL'
          CREATE TABLE bob.ci_resto_half (id int);
          CREATE TABLE public.ci_resto_denied (id int);
          SQL
          if scripts/instalar-bob.sh resto; then echo "::error::resto applied a file that must fail"; exit 1; fi
          [ "$(recorded 99990101000001)$(recorded 99990101000002)$(recorded 99990101000003)" = 110 ] \
            || { echo "::error::recorded: 1 and 2, not 3"; exit 1; }
          ok "SELECT to_regclass('bob.ci_resto_bare') IS NOT NULL AND to_regclass('bob.ci_resto_wrapped') IS NOT NULL" "the good samples did not apply"
          ok "SELECT to_regclass('bob.ci_resto_half') IS NULL" "the failing sample left its first statement applied"
          ok "SELECT rtrim(statements[1], E'\n') = rtrim(:'body', E'\n') FROM supabase_migrations.schema_migrations WHERE version = '99990101000002'" \
            "the record does not hold the file" -v body="$(cat $m/99990101000002_ci_resto_wrapped.sql)"
          rm $m/99990101000003_ci_resto_fails.sql
          printf 'CREATE TABLE bob.ci_resto_meta (id int);\n\\! touch %s/resto-ran-a-shell\n' "$RUNNER_TEMP" > $m/99990101000004_ci_resto_meta.sql
          if scripts/instalar-bob.sh resto; then echo "::error::resto applied a file with a metacommand"; exit 1; fi
          [ ! -e "$RUNNER_TEMP/resto-ran-a-shell" ] && [ "$(recorded 99990101000004)" = 0 ] \
            || { echo "::error::the metacommand sample ran or was recorded"; exit 1; }
          ok "SELECT to_regclass('bob.ci_resto_meta') IS NULL" "the metacommand sample applied its first statement"
          rm $m/99990101000004_ci_resto_meta.sql
          scripts/instalar-bob.sh resto
          echo "resto: whole or nothing, measured"

